<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Bright Star Electrical</title>
    <meta name="description" content="Thank you for contacting Bright Star Electrical. We'll be in touch soon.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0075B2; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .container { max-width: 600px; padding: 40px 20px; }
        .logo { max-width: 180px; margin-bottom: 30px; }
        h1 { font-size: 48px; font-weight: 900; margin-bottom: 15px; }
        .subtitle { font-size: 20px; opacity: 0.9; margin-bottom: 30px; }
        .message { background: rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; margin: 30px 0; backdrop-filter: blur(10px); }
        .message p { font-size: 16px; line-height: 1.6; margin-bottom: 15px; }
        .phone { font-size: 32px; font-weight: 900; color: #ff6c00; text-decoration: none; display: inline-block; margin: 15px 0; }
        .btn { display: inline-block; background: #ff6c00; color: white; padding: 16px 40px; border-radius: 50px; font-weight: 700; font-size: 17px; text-decoration: none; margin-top: 20px; transition: all 0.3s; }
        .btn:hover { background: #e55a00; transform: translateY(-2px); }
        .social { margin-top: 30px; }
        .social a { color: white; font-size: 24px; margin: 0 10px; text-decoration: none; }
        @media (max-width: 600px) {
            h1 { font-size: 36px; }
            .phone { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/logo.jpg" alt="Bright Star Electrical" class="logo">
        <h1>Thank You!</h1>
        <p class="subtitle">Your quote request has been received.</p>
        
        <div class="message">
            <p>We've got your details and one of our team members will call you back within <strong>30 minutes</strong> during business hours.</p>
            <p>If your enquiry is urgent, feel free to call us directly:</p>
            <a href="tel:1300692333" class="phone">1300 672 333</a>
            <p style="font-size: 14px; opacity: 0.8; margin-top: 15px;">24/7 Emergency Service Available</p>
        </div>
        
        <a href="index.html" class="btn">← Back to Home</a>
        

    </div>
</body>
</html>
